# Weekly update pull requests for the GitHub Actions the workflows use and
# for the Python packages pinned in tests/python/requirements-ci.txt (used by
# CI and the Docker image). Each ecosystem's updates come as one grouped PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
