name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: tests/lint.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      # Includes systemd-analyze verify of the unit files (packaging.bats).
      - name: Shell unit tests (as root, so end-to-end tests run too)
        run: sudo bats tests/unit
      - name: Python unit tests (with OSCAL schema validation)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/requirements-ci.txt
          .venv/bin/python -m unittest discover -s tests/python -v

  # Ubuntu 20.04 ships Python 3.8: the OSCAL/HTML tools must keep running there.
  python-3-8:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 >/dev/null
          python3 --version
      - name: Python unit tests (schema validation skipped without trestle)
        run: python3 -m unittest discover -s tests/python -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Misconfigured-container test (Ubuntu ${{ matrix.ubuntu }})
        run: bash tests/run-tests.sh
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
