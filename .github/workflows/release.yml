name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release once the full CI has passed
# on the tagged commit. The release has the CHANGELOG.md section as its notes,
# a source tarball and SHA256SUMS. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag, the script and the changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z"
              exit 1
          fi
          script_version=$(bash ubuntu-sec-audit.sh --version)
          if [[ "$script_version" != "ubuntu-sec-audit ${version}" ]]; then
              echo "::error::the tag is ${GITHUB_REF_NAME} but the script says '${script_version}'"
              exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # The lines between "## [VERSION]" and the next section or the link
          # list, without the blank lines and "---" rule around them.
          awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
              found { lines[++n] = $0 }
              END {
                  while (n > 0 && (lines[n] ~ /^[[:space:]]*$/ || lines[n] == "---")) n--
                  for (i = 1; i <= n && lines[i] ~ /^[[:space:]]*$/; i++) ;
                  for (; i <= n; i++) print lines[i]
              }' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
              echo "::error::CHANGELOG.md has no section for ${VERSION}"
              exit 1
          fi
          cat notes.md

      - name: Source archive and checksums
        run: |
          name="ubuntu-sec-audit-${VERSION}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="ubuntu-sec-audit-${VERSION}"
          # A release drafted by hand for this tag only gets the files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${name}.tar.gz" SHA256SUMS --clobber
          else
              gh release create "$GITHUB_REF_NAME" --verify-tag \
                  --title "ubuntu-sec-audit ${VERSION}" --notes-file notes.md \
                  "${name}.tar.gz" SHA256SUMS
          fi
